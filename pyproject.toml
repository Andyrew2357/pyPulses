[project]
name = "pyPulses"
version = "1.0.0"
description = "Instrument control code for pulsing measurements"
readme = "README.md"
authors = [
    {name = "Jackson Butler", email = "jbutler4@mit.edu"},
    {name = "Andrew DiFabbio", email = "avd38@mit.edu"}
]
maintainers = [
    {name = "Andrew DiFabbio", email = "avd38@mit.edu"}
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Intended Audience :: Science/Research"
]
requires-python = ">=3.10"
dependencies = [
    "bitarray",
    "gpib-ctypes>=0.2",
    "ipython>=9.0",
    "ipywidgets",
    "matplotlib",
    "mkdocs",
    "numpy>=2.0",
    "pyserial>=3.5",
    "pyusb",
    # Provides libusb-1.0.dll on Windows so pyusb can find it without
    # a manual DLL installation.  On Linux/macOS the system libusb is
    # used instead and this package is not installed.
    "libusb-package; sys_platform == 'win32'",
    "PyVISA>=1.14",
    "PyVISA-py>=0.7",
    "pyvisa-py",
    "websockets",
    "zeroconf",
    "zhinst-toolkit"
]

[project.urls]
repository = "https://github.com/Andyrew2357/pyPulses.git"

[build-system]
requires = [
    "setuptools>=61",
    "wheel",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pyPulses*"]

[tool.setuptools.package-data]
"*" = [
    "*.html",
    "*.json",
    "*.npy",
]
# FastFlight2 FPGA bitstreams and DSP firmware (vendored from Signal
# Recovery; see firmware/README.md for provenance).
"pyPulses.devices.fastflight2" = [
    "firmware/*.rbf",
    "firmware/*.bin",
    "firmware/README.md",
]
# udev rules for usb devices (non-windows)
"pyPulses.devices" = [
    "udev/*.rules"
]
